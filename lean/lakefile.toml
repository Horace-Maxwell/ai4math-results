name = "ai4math_research"
version = "0.1.0"
defaultTargets = ["Research"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.34.1"

[[lean_lib]]
name = "Research"

# Challenge files for comparator (https://github.com/leanprover/comparator): the
# statements of the checked theorems, with `sorry` proofs, importing only the frozen
# statement files. Not part of the default build; used only by the comparator CI.
[[lean_lib]]
name = "Comparator"
